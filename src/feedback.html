
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Campus Bites</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header>
    <h1>Campus Bites</h1>
    <p>We Value Your Feedback!</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="deals.html">Deals</a>
        <a href="order.html">Order</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<main>
    <section class="contact-section">
        <h2>Contact Us</h2>
        <p>Location: University Cafeteria, Lahore</p>
        <p>Email: campusbites@example.com</p>
        <p>Phone: 0300-1234567</p>
    </section>

    <section class="feedback-section">
        <h2>Share Your Feedback</h2>
        <p>Your suggestions help us improve our services.</p>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message"
                      rows="5" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Campus Bites. All Rights Reserved.</p>
</footer>

</body>
</html>
